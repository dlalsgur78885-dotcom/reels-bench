services:
  - type: web
    name: fb-ads-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-worker.txt && playwright install chromium
    startCommand: uvicorn fb_ads_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FB_ADS_PROXY
        sync: false
      - key: TRIGGER_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: tts-worker
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-tts.txt
    startCommand: uvicorn tts_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"

  - type: web
    name: mockup-worker
    runtime: python
    region: oregon
    plan: starter           # free 플랜은 512MB — Playwright Chromium은 빠듯함
    buildCommand: pip install -r requirements-mockup.txt && playwright install --with-deps chromium
    startCommand: uvicorn mockup_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
