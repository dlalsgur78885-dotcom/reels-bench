services:
  - type: web
    name: fb-ads-web
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements-worker.txt && playwright install chromium
    startCommand: uvicorn fb_ads_web:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FB_ADS_PROXY
        sync: false
      - key: TRIGGER_SECRET
        sync: false
      - key: PYTHON_VERSION
        value: "3.12"
